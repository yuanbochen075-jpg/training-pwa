# GitHub Pages 部署：push 到 main 后自动发布
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/icons
          cp index.html style.css app.js plan-data.js config.js crypto.js api.js manifest.webmanifest sw.js _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          touch _site/.nojekyll
          rm -rf _site/.github _site/scripts _site/tools _site/supabase _site/api _site/.vercel

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
