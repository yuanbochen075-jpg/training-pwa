# 定时推送提醒（替代原 Vercel Cron）
# GitHub Actions cron 最小间隔 5 分钟；这里每 30 分钟检查一次，
# 命中用户设置时间（±5 分钟窗口）就发送，并用 pushLog 去重。
name: Push reminders
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-push
        run: npm install --no-save web-push@^3.6.7

      - name: Send due reminders
        run: node scripts/push-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
